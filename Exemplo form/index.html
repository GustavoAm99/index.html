<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo formulartio html</title>
</head>
<body>
    <header>
        <h3>Formularios e imputs</h3>
    </header>
    <main>
        <form id="registerForm" method="POST">
            <label for="nome">Nome Completo: </label>
            <input type="text" id="nome" name="nome" placeholder="Nome"required/>
            <br>
            <br>
            <label for="email">Endereço de e-mail:</label>
            <input type="email" id="email" name="email" placeholder="E-mail"/>
            <br>
            <br>
            <label for="senha">Informe sua senha:</label>
            <input type="password" id="senha" name="senha" placeholder="Senha"required minlength="8" title="A senha deve conter no mínimo 8 caracteres"/>
            <br>
            <br>
            <label for="mensagem">Informe sua mensagem:</label>
            <br>
            <br>
            <textarea id="mensagem"  nome="mensagem" rows="4" cols="30"></textarea>
            <br>
            <br>
            <label for="evento">Selecione o evento escolhido:</label>
            <br>
            <br>
            <!-- Tag de seletor, ao selecionar uma das opções do value da option é atribuido ao nome select -->
            <!-- key:value -->
            <select id="evento" name="evento">
                <option value="rock">Show de rock</option>
                <option value="modao">Show de sertanejo</option>
                <option value="teatro">Show de teatro</option>
            </select>
            <br>
            <br>
            <!-- input checkbox -> Opção de multipla escolha: -->
            <label for="termos">
                <input type="checkbox" id="termos" nome="termos"required/>
                Aceito os termos de uso
            </label>
            <br>
            <br>
            <!-- input type radio - Escolha única -->
            <label for=""><input type="radio" nome="pagamento" value="cartao"/>Cartão</label>
            <br>
            <br>
            <label for=""><input type="radio" nome="pagamento" value="pix"/>Pix</label>
            <!-- Para o type radio funcionar a,bos os inputs devem compartilhar o mesmo nome -->
            <br>
            <input type="date"/>
            <br>
            <br>
            <input type="file"/>
            <BR>
            <input type="text" id="cpf" placeholder="000.000.000-00" required pattern="\d{3}\.\d{3}\.\d{3}-\d{2}"/>
            <br>
            <br>
            <input type="submit" value="Cadastrar"/>
            <br>
            <br>
            <button type="button" onclick="">Cancelar</button>
        </form>
    </main>
    <footer>

        <p>Desenvolvido por Gustavo</p>
    </footer>

    <script>
        document.getElementById('registerForm').addEventListener('submit',function (event)
        {
            event.preventDefault(); // impede o comportamento padrão de envio do formulário (recaregamento)
            const nome = document.getElementById('nome').value;
            alert('Olá,'+ nome+' cadastro realizado com sucesso');
        })
            
    </script>


</body>
</html>
